{{- $root := . -}} # To load values from file outside of range loop

{{- if .Values.arr_elements }}
  {{- range $k, $v := .Values.arr_elements }}
  {{- if $v.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app: usenet
  name: {{ $k }}-ingress
  namespace: {{ $root.Values.common.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  {{- if $root.Values.common.tls_enabled }}
    cert-manager.io/cluster-issuer: {{ $root.Values.common.cluster_issuer | default "letsencrypt-production" }}
  {{- end }}
  {{- if eq $k "audiobookshelf" }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  {{- end }}
spec:
  ingressClassName: nginx
  {{- if $root.Values.common.tls_enabled }}
  tls:
  - hosts:
    - {{ .ingress_url }}
    secretName: {{ $k }}-tls
  {{- end }}
  rules:
  - host: {{ .ingress_url }}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: {{ $k }}-service
            port:
              number: {{ .ingress_port }}

  {{- end }}
  {{- end }}
{{- end }}